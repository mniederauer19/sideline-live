# Fly.io hosting for sideline live (always on, with a volume for the database)
# `fly launch --copy-config --no-deploy` will ask for an app name and fill it in.
app = "sideline-live"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # keep one machine running so live games are followed every few seconds
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

# comments, picks, lineups and every stored play live here across restarts
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
